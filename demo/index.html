:root{
  --orange:#C4462A;--orange-bright:#E0653F;--bone:#F3DCC2;--paper:#FBF5EC;--white:#fff;
  --ink:#1B2620;--ink-raised:#26342D;--ink-muted:#5A635E;--pine:#234536;--pine-raised:#2D5444;
  --sky:#8DB3D3;--sky-tint:#DCE8F2;--mist:#F0F2F4;--line:#E6DCCB;--rule:#E4E7EA;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --sans:"Manrope",ui-sans-serif,system-ui,sans-serif;
  --shadow:0 1px 2px rgba(27,38,32,.06),0 6px 20px rgba(27,38,32,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.mk{width:1em;height:1em;display:inline-block;vertical-align:-.12em}

/* the stage: drawn at 1440 x 900 and scaled to fit any screen */
#canvas{position:absolute;width:1440px;height:900px;left:0;top:0;transform-origin:0 0;overflow:hidden;
  background:radial-gradient(1200px 700px at 70% 0%,#24332b 0%,var(--ink) 60%)}
.cap{position:absolute;left:64px;right:64px;top:30px;height:96px;color:var(--bone)}
.cap .k{font-size:14px;font-weight:600;color:rgba(243,220,194,.6);display:flex;gap:10px;align-items:center}
.cap .k .mk{color:var(--orange-bright);font-size:18px}
.cap .t{font-family:var(--display);font-size:36px;font-weight:700;letter-spacing:-.01em;margin-top:6px;line-height:1.1}
.cap .s{font-size:17px;font-weight:500;color:rgba(243,220,194,.75);margin-top:6px}
.area{position:absolute;left:0;right:0;top:136px;bottom:34px;display:flex;align-items:center;justify-content:center;gap:48px}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.nofx *, .nofx{animation-duration:0s!important;transition:none!important}

/* hidden-until-shown pieces */
.hid{display:none!important}
.pop{animation:pop .35s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.flash{animation:flash 1.6s ease both}
@keyframes flash{0%{background:#FFE9B8}100%{background:transparent}}
.pulse{animation:pulse 1.4s ease 2}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(141,179,211,.0)}50%{box-shadow:0 0 0 8px rgba(141,179,211,.45)}}

/* presenter controls */
#hud{position:fixed;left:14px;bottom:10px;display:flex;gap:8px;align-items:center;font-size:12px;color:rgba(243,220,194,.55);z-index:50;user-select:none}
#hud button{background:rgba(255,255,255,.08);border:0;border-radius:8px;color:var(--bone);padding:5px 10px;font-size:12px}
#hud button:hover{background:rgba(255,255,255,.16)}
#hud .dots{display:flex;gap:4px}
#hud .dots i{width:7px;height:7px;border-radius:9px;background:rgba(243,220,194,.25);display:block;cursor:pointer}
#hud .dots i.on{background:var(--orange-bright)}
#hud.off{opacity:0}
#notes{position:fixed;left:50%;transform:translateX(-50%);bottom:44px;width:min(860px,92vw);background:#fff;color:var(--ink);border-radius:14px;padding:16px 20px;box-shadow:0 20px 50px rgba(0,0,0,.4);z-index:60;font-size:15px;line-height:1.45}
#notes h4{margin:0 0 4px;font-family:var(--display);font-size:13px;color:var(--orange);font-weight:700}
#notes .wow{font-family:var(--display);font-size:19px;font-weight:700;margin-bottom:8px}
#notes .say{border-left:3px solid var(--sky);padding-left:12px;margin:8px 0;font-style:italic}
#notes .step{font-size:13px;color:var(--ink-muted)}
#menu{position:fixed;inset:0;background:rgba(15,22,18,.85);z-index:70;display:flex;align-items:center;justify-content:center}
#menu .box{background:#fff;border-radius:16px;padding:20px 24px;width:560px;max-height:86vh;overflow:auto}
#menu h3{font-family:var(--display);margin:0 0 10px}
#menu button{display:flex;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:10px 4px;font-size:15px}
#menu button:hover{background:var(--mist)}
#menu button b{width:24px;color:var(--ink-muted);font-weight:600}
#menu .keys{font-size:13px;color:var(--ink-muted);margin-top:12px;line-height:1.6}

/* old-way CRM: deliberately plain */
.crm{display:flex;height:100%;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#333}
.crm .side{width:170px;background:#3b4a5a;color:#c8d0d8;padding:12px 0}
.crm .side div{padding:8px 16px}
.crm .side .on{background:#2c3946;color:#fff;border-left:3px solid #6c8ebf}
.crm .main{flex:1;background:#eef0f2;padding:12px 16px;position:relative}
.crm .tb{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.crm .tb span{border:1px solid #b9c0c7;background:#fff;padding:4px 8px;border-radius:2px;color:#555}
.crm table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #c7ccd1}
.crm th{background:#dfe3e7;text-align:left;padding:6px 8px;border-bottom:1px solid #c7ccd1;font-weight:bold;color:#444}
.crm td{padding:6px 8px;border-bottom:1px solid #e3e6e9;white-space:nowrap}
.crm tr.hl td{background:#fff6c9}
.crm .st{background:#e3e8ee;border:1px solid #c5ccd3;padding:1px 6px;border-radius:2px}
.crm .cmodal{position:absolute;right:24px;top:70px;width:380px;background:#fff;border:1px solid #9aa4ad;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.crm .cmodal .hd{background:#dfe3e7;padding:7px 10px;font-weight:bold;border-bottom:1px solid #c7ccd1}
.crm .cmodal .bd{padding:10px;line-height:1.5}
.crm .warn{color:#b3261e;font-weight:bold}


/* ================= The product, drawn from the settled board (final screens) =================
   Every size below is the board's own, in the board's pixels. The windows and the phone scale
   their contents (.sc) down to fit the stage, so the numbers can stay exactly as drawn. */

/* a laptop browser window */
.win{width:1200px;height:724px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45);display:flex;flex-direction:column;position:relative;flex:none}
.win.sm{width:930px;height:680px}
.chrome{height:34px;flex:none;background:#E9ECEE;display:flex;align-items:center;padding:0 14px;gap:7px}
.chrome i{width:11px;height:11px;border-radius:9px;background:#C9CED2;display:block}
.chrome .url{margin-left:18px;flex:1;max-width:520px;height:22px;border-radius:7px;background:#fff;font-size:12px;color:#5A635E;display:flex;align-items:center;padding:0 10px}
.app{flex:1;position:relative;overflow:hidden}
.app > .sc{position:absolute;left:0;top:0;width:1333.4px;height:766.7px;transform:scale(.9);transform-origin:0 0}
.win.sm .app > .sc{width:1033.4px;height:717.8px}

/* the board's base: Manrope 14/1.5 ink */
.ab{font-family:Manrope,ui-sans-serif,system-ui,sans-serif;font-weight:500;font-size:14px;line-height:1.5;color:#1B2620;position:relative;overflow:hidden;width:100%;height:100%;background:#fff}
.ab b{font-weight:700}
.ab h1,.ab h2,.ab h3{margin:0}
.mute{color:#5A635E}.faint{color:#6F7873}

/* builder nav */
.nav{height:54px;display:flex;align-items:center;padding:0 28px;border-bottom:1px solid #E3E7EA;position:relative;background:#fff;z-index:3}
.logo{display:flex;align-items:center;gap:9px;font-family:"Bricolage Grotesque",sans-serif;font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1}
.logo .mk{font-size:24px;color:#1B2620}
.tabs{position:absolute;left:0;right:0;top:0;display:flex;justify-content:center;gap:28px;pointer-events:none}
.tabs span{font-size:14px;padding:16px 0 13px;border-bottom:3px solid transparent;color:#5A635E}
.tabs span.on{border-bottom-color:#8DB3D3;font-weight:700;color:#1B2620}
.co{margin-left:auto;font-size:13px;color:#5A635E}
.co i{font-style:normal;color:#6F7873}

/* the page column */
.pg{position:absolute;top:54px;left:0;right:0;bottom:0;overflow:hidden}
.col{width:880px;margin:0 auto;padding:30px 0 150px;display:flex;flex-direction:column;gap:20px}
.hd{display:flex;align-items:flex-end;gap:16px}
.hd > div:first-child{flex:1;min-width:0}
h1.t1{font-family:"Bricolage Grotesque",sans-serif;font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.st{font-size:14.5px;color:#5A635E;padding-top:6px}
h2.t2{font-size:21px;font-weight:600;letter-spacing:-.02em;line-height:1.25;padding-bottom:6px}
.crumb{font-size:13px;color:#5A635E;padding-bottom:8px}
.dim{opacity:.38}

/* buttons */
.b{height:32px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px;box-shadow:inset 0 0 0 1px #B9C4CC;background:#fff;flex:none}
.b.ink{background:#1B2620;color:#fff;box-shadow:none}
.b.off{background:#E3E7EA;color:#9AA3A8;box-shadow:none}
.b.ok{background:#E4EEF6;box-shadow:none;color:#1B2620}
.b.lg{height:auto;padding:9px 18px;font-size:14px;font-weight:700}
.b .dot{width:7px;height:7px;border-radius:9px;background:#C4462A}
.cnt{background:#E4EEF6;border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:700}
.chev{color:#6F7873;width:8px;flex:none}
.dotr{width:7px;height:7px;border-radius:50%;background:#C4462A;display:inline-block;margin-right:8px;flex:none}
.dotn{width:7px;height:7px;display:inline-block;margin-right:8px;flex:none}

/* rows */
.rw{display:flex;align-items:center;gap:14px;padding:11px 0;border-top:1px solid #E3E7EA}
.rw:first-child{border-top:0}
.rws.tb > .rw:first-child{border-top:1px solid #E3E7EA}
.rw .w150{width:150px;flex:none}
.rw .w140{width:140px;flex:none;font-size:13px;color:#5A635E;white-space:nowrap}
.rw .w84{width:84px;flex:none;font-size:13px;color:#5A635E}
.rw .w64{width:64px;flex:none;font-size:13px;color:#6F7873;text-align:right}
.rw .w104{width:104px;flex:none;display:flex}
.rw .w104 .b{width:104px}
.rw .fx{flex:1;min-width:0}
.rw .w40{width:40px;flex:none;text-align:right}
.kv{display:flex;gap:14px;padding:10px 0;border-top:1px solid #E3E7EA;align-items:baseline}
.kv:first-child{border-top:0}
.kv .k{width:134px;flex:none;color:#5A635E}
.kv .v{flex:1;font-weight:600}
.two{display:flex;gap:48px;padding-top:4px}
.two > div{flex:1;min-width:0}

/* the sale and financing track */
.trk{border-top:1px solid #E3E7EA;border-bottom:1px solid #E3E7EA;padding:6px 0}
.trk > div{display:flex;align-items:center;padding:6px 0}
.trk .l{width:86px;flex:none;font-size:13px;color:#5A635E}
.trk span{font-size:13px;white-space:nowrap;color:#6F7873}
.trk span.dn{color:#1B2620;font-weight:600}
.trk span.on{background:#E4EEF6;border-radius:999px;padding:2px 10px;font-weight:700;color:#1B2620}
.trk i{flex:1;height:0;border-top:2px dotted #C9D1D6;margin:0 10px;min-width:16px}
.trk i.dn{border-top:2px solid #1B2620}

/* Ask Goodplace bar, with the sky box that rides on it */
.gb{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:600px;z-index:6}
.gb.wide{width:680px}
.sky{margin:0 28px;background:#E4EEF6;border-radius:16px 16px 0 0;padding:10px 16px 11px;font-size:13.5px;display:flex;gap:12px}
.sky > span:first-child{flex:1}
.sky .more{color:#5A635E;font-size:13px;white-space:nowrap}
.gin{background:#fff;border:1px solid #E3E7EA;box-shadow:0 6px 24px rgba(27,38,32,.10);border-radius:28px;height:56px;padding:0 11px 0 17px;display:flex;align-items:center;gap:10px}
.gin .mk{font-size:24px;color:#1B2620;flex:none}
.gin .tx{flex:1;font-size:15px;line-height:1;color:#6F7873;white-space:nowrap;overflow:hidden}
.gin .tx.typed{color:#1B2620}
.gin .pl{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 1.5px #B9C4CC;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:20px;font-weight:400}
.gin .go{width:34px;height:34px;border-radius:50%;background:#1B2620;color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:17px}
/* setup question card in the bar (A5.2) */
.qc{background:#fff;border:1px solid #E3E7EA;border-radius:28px;box-shadow:0 10px 40px rgba(27,38,32,.16);overflow:hidden}
.qc .qh{background:#E4EEF6;padding:10px 18px;display:flex;align-items:center;gap:12px;font-size:13px}
.qc .bars{display:inline-flex;gap:4px}
.qc .bars i{width:22px;height:4px;border-radius:2px;background:#D5DADE}
.qc .bars i.on{background:#1B2620}
.qc .qb{padding:18px 20px 16px;display:flex;flex-direction:column;gap:12px}
.qc .qq{display:flex;gap:10px;align-items:flex-start}
.qc .qq .mk{font-size:20px;margin-top:4px;flex:none}
.qc .opts{display:flex;flex-direction:column;gap:8px;padding-left:30px}
.qo{display:flex;align-items:center;gap:12px;border:1px solid #B9C4CC;border-radius:12px;padding:10px 14px}
.qo b{flex:1}
.qo span{color:#5A635E;font-size:13px}
.qo.on{border:2px solid #1B2620;padding:9px 13px}
.qc .gin{border:0;box-shadow:none;border-top:1px solid #E3E7EA;border-radius:0}
.file{display:inline-flex;align-items:center;gap:8px;background:#F5F7F9;border-radius:10px;padding:8px 12px;font-weight:600;font-size:13.5px}

/* side sheet (B7, C12.1, D14) */
.veil{position:absolute;inset:54px 0 0 0;background:rgba(255,255,255,.62);z-index:7}
.ss{position:absolute;right:0;top:54px;bottom:0;width:460px;background:#fff;border-left:1px solid #E3E7EA;box-shadow:-12px 0 40px rgba(27,38,32,.10);padding:22px 24px;display:flex;flex-direction:column;gap:16px;z-index:8}
.ss .sh{display:flex;align-items:center}
.ss .sh h2{font-size:21px;font-weight:600;letter-spacing:-.02em;line-height:1.25;flex:1}
.ss .x{font-size:20px;color:#5A635E}
.ss .ssub{font-size:13px;color:#5A635E;margin-top:2px}
.lbl{display:block;font-size:13px;color:#5A635E;padding-bottom:5px}
.ta{display:block;border:1px solid #B9C4CC;border-radius:12px;padding:9px 13px;font-size:14.5px;min-height:44px;background:#fff;line-height:1.5}
.ta.focus{border-color:#8DB3D3;box-shadow:0 0 0 3px #E4EEF6}
.ta.mono{font-size:13px;line-height:1.5;max-height:118px;overflow:hidden}
.hint{font-size:12.5px;color:#5A635E;padding-top:5px}
.quote{background:#F5F7F9;border-radius:12px;padding:12px 14px;font-size:14.5px}
.gx{background:#F5F7F9;border-radius:12px;padding:11px 13px;display:flex;gap:10px;font-size:13.5px;line-height:1.5}
.gx .mk{font-size:18px;flex:none;margin-top:1px}
.gx > div{flex:1}
.tg{width:40px;height:24px;border-radius:999px;background:#C9D1D6;display:inline-flex;align-items:center;padding:0 3px;flex:none;transition:background .25s}
.tg::after{content:"";width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .25s}
.tg.on{background:#1B2620}.tg.on::after{transform:translateX(16px)}
.seg{display:inline-flex;border:1px solid #E3E7EA;border-radius:999px;padding:3px;gap:2px}
.seg span{padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600}
.seg span.on{background:#1B2620;color:#fff}
.sel{border:1px solid #B9C4CC;border-radius:12px;padding:9px 13px;display:flex;justify-content:space-between;font-size:14px}
.btns{display:flex;gap:8px;align-items:center;padding-top:4px}

/* the C9 conversation panel that opens from the bar */
.cp{background:#fff;border:1px solid #E3E7EA;border-radius:22px 22px 0 0;box-shadow:0 -8px 40px rgba(27,38,32,.12);padding:16px 18px 12px;margin:0 0 -1px;display:flex;flex-direction:column;gap:12px;max-height:640px;overflow-y:auto;scrollbar-width:none}
.cp .hdl{width:36px;height:4px;border-radius:4px;background:#D5DADE;margin:0 auto}
.cp .me{align-self:flex-end;background:#F0F2F4;border-radius:14px;padding:7px 13px;font-size:14px;max-width:80%}
.cp .gp{display:flex;gap:10px;font-size:14px;line-height:1.55}
.cp .gp .mk{font-size:18px;flex:none;margin-top:2px}
.cp ol{margin:4px 0 0;padding-left:18px}
.cp li{margin:5px 0}
.cp .why{display:block;font-size:12.5px;color:#5A635E}
.cp .msg{border:1px solid #B9C4CC;border-radius:12px;padding:9px 13px;margin-top:8px}
.cp + .gin{border-radius:0 0 28px 28px}

/* reading screen (A4.1 / A4.2) */
.fs{border-top:1px solid #E3E7EA;display:grid;grid-template-columns:24px 170px minmax(0,1fr) auto;column-gap:14px;row-gap:2px;align-items:baseline;padding:11px 0;font-size:14.5px}
.fs .ck{width:20px;height:20px;border-radius:50%;background:#E4EEF6;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;transform:translateY(3px)}
.fs .ck.no{background:#fff;box-shadow:inset 0 0 0 1.5px #D5DADE}
.fs .nd{font-size:13px;color:#69726D;white-space:nowrap}
.fs .sub{grid-column:3 / -1;padding-top:6px;font-size:13.5px;line-height:21px}
.fs .sub > div{display:grid;grid-template-columns:200px minmax(0,1fr);column-gap:12px;margin:0 -8px;padding:4px 8px;border-radius:8px}
.fs .sub > div > span:first-child{color:#69726D}
.fs .sub > div.new{background:#E4EEF6}
.dots3{display:inline-flex;gap:5px;margin-left:10px;vertical-align:middle}
.dots3 i{width:6px;height:6px;border-radius:50%;background:#1B2620;opacity:.18;animation:d3 1.2s infinite}
.dots3 i:nth-child(2){animation-delay:.2s}.dots3 i:nth-child(3){animation-delay:.4s}
@keyframes d3{30%{opacity:1}}

/* homes details page (A5.2 behind the card) */
.dtabs{display:flex;gap:28px;border-bottom:1px solid #E3E7EA;margin-top:4px}
.dtabs span{padding:0 0 10px;font-size:14.5px;color:#5A635E;border-bottom:3px solid transparent}
.dtabs span.on{color:#1B2620;font-weight:700;border-bottom-color:#8DB3D3}
.dside{width:170px;flex:none;display:flex;flex-direction:column;gap:2px;font-size:14px;color:#5A635E}
.dside span{padding:5px 10px;border-radius:8px}
.dside span.on{background:#F0F2F4;color:#1B2620;font-weight:600}
.dside small{font-size:12.5px;color:#6F7873;margin-left:6px}
.src{color:#6F7873;font-size:13px;white-space:nowrap}

/* insights and marketing */
.fun{background:#F5F7F9;border-radius:14px;padding:16px 20px;display:flex;align-items:center;gap:14px}
.fun > div{flex:1}
.fun .n{font-family:"Bricolage Grotesque",sans-serif;font-size:28px;font-weight:700;line-height:1.1}
.fun .l{font-size:13px;color:#5A635E}
.fun .ar{flex:none;color:#5A635E;font-size:18px}
.pills{display:flex;gap:4px;font-size:13px;color:#5A635E}
.pills span{padding:3px 10px;border-radius:999px}
.pills span.on{box-shadow:inset 0 0 0 1px #B9C4CC;color:#1B2620;font-weight:600}
.lst .r{display:flex;gap:10px;padding:7px 0;border-top:1px solid #E3E7EA;font-size:13.5px}
.lst .r:first-child{border-top:0}
.lst .r .n{margin-left:auto;color:#5A635E;white-space:nowrap}
.mini{font-size:12.5px;color:#5A635E;font-weight:600;padding-bottom:4px}
.qr{display:flex;gap:28px;align-items:center}

/* sign in (A1.3A) */
.signin{position:absolute;top:54px;left:0;right:0;bottom:0;display:flex;justify-content:center;padding-top:80px}
.signin .bx{width:430px}
.signin .petals{display:flex;gap:10px;font-size:58px;margin-bottom:22px}
.signin .petals .a{color:#1B2620}.signin .petals .s{color:#8DB3D3}
.inp{display:block;border:1px solid #B9C4CC;border-radius:12px;padding:11px 13px;font-size:15.5px;min-height:48px;background:#fff}
.inp.focus{border-color:#8DB3D3;box-shadow:0 0 0 3px #E4EEF6}

/* ---------------- the buyer's phone ---------------- */
.phone{width:346px;height:722px;border-radius:48px;background:#0d1210;padding:11px;box-shadow:0 30px 80px rgba(0,0,0,.5);flex:none;position:relative}
.phone .scr{width:324px;height:700px;border-radius:38px;overflow:hidden;background:#FBF5EC;position:relative}
.phone .scr > .sc{position:absolute;left:0;top:0;width:390px;height:843.4px;transform:scale(.8308);transform-origin:0 0;overflow:hidden}
.phone .notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:96px;height:26px;border-radius:20px;background:#0d1210;z-index:20}
.stat{height:46px;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0;font-size:15px;font-weight:700;color:#1B2620;position:relative;z-index:9}
.stat.lt{color:#FBF5EC}
.bp{position:absolute;inset:0;background:#FBF5EC;font-family:Manrope,ui-sans-serif,system-ui,sans-serif;font-weight:500;font-size:14px;line-height:1.5;color:#1B2620}
.bp b{font-weight:700}
.bph{height:50px;display:flex;align-items:center;padding:0 20px;font-weight:700;font-size:14.5px;border-bottom:1px solid #E6DCCB;background:#FBF5EC}
.wg{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:#5A635E}
.wg .mk{font-size:16px;color:#C4462A}
/* public page (Y1.1) */
.hero{background:#C4462A;color:#FBF5EC;padding:10px 20px 24px}
.hero .by{display:flex;align-items:center;font-weight:700;font-size:14.5px}
.hero .by .wg{color:#FBF5EC}.hero .by .wg .mk{color:#FBF5EC}
.hero h1{font-family:"Bricolage Grotesque",sans-serif;font-size:36px;font-weight:700;letter-spacing:-.025em;line-height:1.05;margin:20px 0 10px}
.hero h1 span{color:#F3DCC2}
.hero .ln{font-size:15.5px}
.hero .meta{font-weight:700;padding:12px 0 14px}
.hbtn{height:42px;padding:0 17px;border-radius:999px;font-size:14.5px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center}
.hbtn.fill{background:#FBF5EC;color:#1B2620}
.hbtn.line{box-shadow:inset 0 0 0 1.5px #FBF5EC;color:#FBF5EC}
.hbtn.shb{width:42px;padding:0;justify-content:center;box-shadow:inset 0 0 0 1.5px #FBF5EC;margin-left:auto}
.bpc{padding:20px 20px 150px;display:flex;flex-direction:column;gap:16px}
.ph{background-size:cover;background-position:center;width:100%;border-radius:16px}
.strip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.strip .ph{border-radius:12px}
.bpc h2{font-size:19px;font-weight:600;letter-spacing:-.02em}
.bpc .p{font-size:15px;line-height:1.55}
/* bottom: job chips and the buyer bar */
.bb{position:absolute;left:16px;width:358px;bottom:16px;z-index:12}
.jobs{display:flex;gap:8px;overflow:hidden;padding-bottom:8px;margin-right:-16px}
.jobs span{border:1px solid #1B2620;border-radius:999px;padding:5px 13px;font-size:13.5px;font-weight:600;white-space:nowrap;background:#FBF5EC}
.bin{background:#fff;border:1px solid #E6DCCB;box-shadow:0 6px 24px rgba(27,38,32,.10);border-radius:28px;height:56px;padding:0 11px 0 17px;display:flex;align-items:center;gap:10px}
.bin .mk{font-size:22px;color:#C4462A;flex:none}
.bin .tx{flex:1;font-size:15px;line-height:1;color:#6F7873;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bin .tx.typed{color:#1B2620}
.bin .go{width:34px;height:34px;border-radius:50%;background:#C4462A;color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:17px}
/* chat (Y4.1 / Y5.1) */
.chat{position:absolute;left:0;right:0;top:46px;bottom:0;background:#FBF5EC;z-index:5;display:flex;flex-direction:column}
.ms{flex:1;overflow:hidden;padding:20px 20px 110px;display:flex;flex-direction:column;gap:16px}
.m{font-size:15.5px;line-height:1.5}
.m.me{align-self:flex-end;background:#C4462A;color:#FBF5EC;border-radius:14px;padding:7px 14px;max-width:80%}
.m.gp{display:flex;gap:10px;align-items:flex-start}
.m.gp > .mk{font-size:18px;color:#C4462A;flex:none;margin-top:3px}
.m.gp > div{flex:1;min-width:0}
.m .s2{font-size:12.5px;color:#5A635E;margin-top:2px}
.m.note{font-size:12.5px;color:#5A635E;text-align:center;align-self:center}
.obt{display:flex;gap:8px;padding:9px 0 3px;flex-wrap:wrap}
.ob{height:36px;padding:0 15px;border-radius:999px;font-size:15.5px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;box-shadow:inset 0 0 0 1.5px #1B2620}
.ob.or{background:#C4462A;color:#FBF5EC;box-shadow:none}
.wb{height:44px;border-radius:999px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;width:100%;box-shadow:inset 0 0 0 1.5px #1B2620}
.wb.or{background:#C4462A;color:#FBF5EC;box-shadow:none}
.wb.big{height:50px}
.bc{background:#fff;border:1px solid #E6DCCB;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.bc .lb{font-size:13.5px;color:#5A635E}
.bc .num{font-family:"Bricolage Grotesque",sans-serif;font-size:48px;font-weight:700;letter-spacing:-.03em;line-height:1}
.bc .num.or{color:#C4462A;font-size:40px}
.mr{display:flex;gap:12px;padding:8px 0;border-top:1px solid #E6DCCB}
.mr:first-child{border-top:0}
.mr > span:first-child{flex:1;color:#5A635E}
.mr > span:last-child{font-weight:600}
.mr.tot{border-top:1px solid #1B2620;font-weight:700}
.mr.tot > span{color:#1B2620!important;font-weight:700!important}
.sm{font-size:12.5px;color:#5A635E;line-height:1.5}
.ch{border:1px solid #5A635E;border-radius:999px;padding:6px 14px;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;background:#FBF5EC}
.ch.on{border:2px solid #1B2620;padding:5px 13px}
.chs{display:flex;gap:8px;flex-wrap:wrap}
.chs.col{flex-direction:column;align-items:flex-start}
.plans{display:flex;gap:8px}
.pc{flex:1;border:1px solid #E6DCCB;border-radius:12px;padding:10px;font-size:12.5px;line-height:1.35}
.pc .ic{width:34px;height:34px;border-radius:8px;background:#F3DCC2;display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:8px}
.pc b{display:block;font-size:14px}
.pc .pr{font-weight:700;font-size:14px;margin-top:6px}
.pc.on{border:2px solid #1B2620;padding:9px}
.sl{position:relative;height:30px;margin:4px 6px 0}
.sl .tr{position:absolute;left:0;right:0;top:12px;height:3px;background:#E6DCCB;border-radius:3px}
.sl .fl{position:absolute;left:0;top:12px;height:3px;background:#C4462A;border-radius:3px;transition:width .5s}
.sl .kn{position:absolute;top:2px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px #C4462A;transition:left .5s}
.sl .tk{position:absolute;top:10px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#E6DCCB}
.sll{display:flex;justify-content:space-between;font-size:12.5px;color:#5A635E;margin:0 -2px}
.sll b{color:#1B2620}
.cal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.cal .dh{font-size:12.5px;color:#5A635E}
.cal .dn{font-size:17px;font-weight:700;margin-bottom:4px}
.sl2{border:1px solid #1B2620;border-radius:8px;height:32px;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:600}
.sl2.x{border-color:transparent;color:#9AA3A8;text-decoration:line-through;font-weight:500}
.sl2.on{background:#C4462A;color:#FBF5EC;border-color:#C4462A}
.tbl3{width:100%;border-collapse:collapse;font-size:14px}
.tbl3 th{font-weight:500;color:#5A635E;text-align:right;font-size:13px;padding:4px 0}
.tbl3 td{padding:9px 0;border-top:1px solid #E6DCCB;text-align:right;font-weight:600}
.tbl3 td:first-child,.tbl3 th:first-child{text-align:left;font-weight:500}
/* the bottom sheet (Y13.1) and share sheet (Y17.1) */
.shade{position:absolute;inset:0;background:rgba(27,38,32,.32);z-index:14}
.bsheet{position:absolute;left:0;right:0;bottom:0;background:#FBF5EC;border-radius:22px 22px 0 0;padding:12px 18px 26px;z-index:15;display:flex;flex-direction:column;gap:12px}
.bsheet .hdl{width:40px;height:4px;border-radius:4px;background:#D9CDBB;margin:0 auto 6px}
.bsheet h3{font-family:"Bricolage Grotesque",sans-serif;font-size:26px;font-weight:700;letter-spacing:-.02em}
.bsheet .inp{background:#fff;border-color:#5A635E}
.share{position:absolute;left:12px;right:12px;bottom:12px;z-index:15;display:flex;flex-direction:column;gap:10px}
.share .card{background:#F2F2F4;border-radius:14px;padding:14px;font-size:15px}
.share .apps{display:flex;gap:18px;padding:12px 4px;font-size:12px;color:#3C3C43;text-align:center}
.share .apps i{display:block;width:56px;height:56px;border-radius:14px;margin-bottom:5px}
.share .row{background:#fff;padding:12px 14px;font-size:16px;border-top:1px solid #E5E5EA}
/* her inbox and the emails (TR10 / E12) */
.inbox{position:absolute;inset:46px 0 0 0;background:#fff}
.inbox h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:32px;padding:4px 20px 12px}
.inbox .it{padding:12px 20px;border-top:1px solid #E5E7EA;font-size:14.5px}
.inbox .it b{display:block}
.inbox .it .pv{color:#5A635E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inbox .it.new b::before{content:"";display:inline-block;width:9px;height:9px;border-radius:9px;background:#2F6FDE;margin-right:7px}
.mail{position:absolute;inset:46px 0 0 0;background:#fff;z-index:7;overflow:hidden;font-size:14.5px}
.mail .eh{background:#F0F2F4;padding:12px 20px;font-size:13px;color:#5A635E}
.mail .eh b{color:#1B2620}
.mail .eh .sj{font-weight:700;color:#1B2620;font-size:14px;margin-top:2px}
.mail .eb{padding:20px}
.mail .ef{display:flex;align-items:center;gap:6px;font-family:"Bricolage Grotesque",sans-serif;font-size:19px;font-weight:700}
.mail .ef small{font-family:Manrope,sans-serif;font-size:12.5px;font-weight:500;color:#5A635E;display:flex;align-items:center;gap:4px}
.mail .ef small .mk{color:#C4462A}
.mail h2{font-family:"Bricolage Grotesque",sans-serif;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:12px 0 10px}
.mail .bx{background:#FBF5EC;border-radius:12px;padding:6px 14px;margin:14px 0}
.mail .bx .r{display:flex;gap:12px;padding:8px 0;border-top:1px solid #E6DCCB}
.mail .bx .r:first-child{border-top:0}
.mail .bx .r span:first-child{width:60px;flex:none;color:#5A635E}
.mail .foot{border-top:1px solid #E6DCCB;margin-top:18px;padding-top:12px;font-size:12px;color:#5A635E;line-height:1.5}
.mail .foot u{color:#1B2620}
.banner{position:absolute;left:12px;right:12px;top:52px;background:rgba(255,255,255,.97);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:13px 15px;z-index:16;font-size:14.5px;line-height:1.4}
.banner .ap{display:flex;gap:6px;align-items:center;font-size:12.5px;color:#5A635E;font-weight:600;margin-bottom:3px}
.banner .ap .mk{color:#C4462A}

/* story text beside the phone */
.side{width:360px;color:#F3DCC2}
.side .big{font-family:"Bricolage Grotesque",sans-serif;font-size:28px;font-weight:700;line-height:1.15}
.side .p{font-size:17px;margin-top:12px;line-height:1.5;opacity:.85}

.typing{display:inline-flex;gap:4px;padding-top:6px}
.typing i{width:7px;height:7px;border-radius:9px;background:#5A635E;opacity:.4;animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{50%{opacity:1}}
.caret::after{content:"";display:inline-block;width:1.5px;height:1.1em;background:#1B2620;margin-left:1px;vertical-align:-.2em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* yard sign and the close */
.yard{width:300px;background:#fff;border-radius:6px;padding:20px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4);position:relative;font-family:Manrope,sans-serif;color:#1B2620}
.yard:after{content:"";position:absolute;left:50%;bottom:-150px;width:10px;height:150px;background:#7a5a3a;transform:translateX(-50%)}
.close{position:absolute;inset:0;background:#C4462A;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.close .mk{font-size:110px;color:#F3DCC2}

.chg4 label{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid #E3E7EA;border-radius:10px;padding:8px 10px;font-size:13.5px;line-height:1.45}
.chg4 label i{width:18px;height:18px;border-radius:5px;background:#1B2620;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px;font-style:normal}

/* charts on Insights and Marketing */
.chart{border:1px solid #E3E7EA;border-radius:16px;padding:14px 18px 10px}
.chart .ct{display:flex;align-items:baseline;gap:10px}
.chart .ct b{font-family:"Bricolage Grotesque";font-size:26px}
.chart svg{display:block;width:100%}
.hbar{display:grid;grid-template-columns:170px 1fr 34px;align-items:center;gap:10px;font-size:13.5px;padding:4px 0}
.hbar .tr{height:10px;border-radius:5px;background:#F0F2F4;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:#8DB3D3;border-radius:5px;width:0;transition:width .9s ease}
.hbar .tr i.ink{background:#1B2620}
.hbar b{text-align:right}

/* the close */
.close4{position:absolute;inset:0;background:#C4462A;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.close4 .wv{width:180px;height:210px;background:var(--wave) center/contain no-repeat}
.close4 h1{font-family:"Bricolage Grotesque";font-size:66px;margin:18px 0 10px;letter-spacing:-.025em;line-height:1.02}
.close4 h1 span{color:#F3DCC2}
.close4 p{font-size:21px;font-weight:500;opacity:.93;max-width:820px;line-height:1.45;margin:0}
.close4 .row3{display:flex;gap:14px;margin-top:30px}

.cap .s{font-size:15px;margin-top:3px}
.area{top:94px;bottom:6px;gap:40px}
.mac{flex:none;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 30px 50px rgba(0,0,0,.5))}
.mac .lid{background:#0a0a0b;border-radius:22px 22px 8px 8px;padding:15px 15px 16px;box-shadow:inset 0 0 0 2px #8f9398,inset 0 0 0 3px #2a2c2e;position:relative}
.mac .cam{position:absolute;left:50%;top:5px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#1d2a33;box-shadow:inset 0 0 0 1.5px #0f1418}

.bb:before{content:"";position:absolute;left:-16px;right:-16px;top:-26px;bottom:-16px;background:linear-gradient(rgba(251,245,236,0),#FBF5EC 34%);z-index:-1}

const PROGRAM = { name: 'Utah’s First-Time Homebuyer Assistance', short: 'Utah’s first-time buyer program', cap: 20000, priceCap: 450000 };

/* The monthly sums are done in code, never by the assistant (product rule). Prices and rates are made up.
   The program's terms are real: Utah Housing Corporation, Form 600, revised 23 Feb 2026 (up to $20,000 on a new,
   never-lived-in home up to $450,000; 0%, no monthly payment, repaid from equity on sale or refinance). */
const MATH = { price: 419900, rate: 7.0, taxRate: 0.0055, insYear: 1140, miRate: 0.0055, hoa: 165, closingShare: 0.03 };
function estimate(downShare, program, price = MATH.price, rate = MATH.rate) {
  const m = MATH, down = price * downShare, loan = price - down, i = rate / 100 / 12;
  const pi = loan * i / (1 - Math.pow(1 + i, -360));
  const tax = price * m.taxRate / 12, ins = m.insYear / 12, mi = downShare < 0.2 ? loan * m.miRate / 12 : 0;
  const closing = price * m.closingShare;
  const help = program && price <= PROGRAM.priceCap ? Math.min(PROGRAM.cap, down + closing) : 0;
  return { pi, tax, ins, mi, hoa: m.hoa, monthly: pi + tax + ins + mi + m.hoa, down, closing, cash: down + closing - help, help };
}

/* A made-up QR pattern: it only looks like a code (finder squares plus noise) */
function qr(size = 140) {
  const n = 25, c = size / n; let s = '', seed = 7;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const finder = (x, y) => `<rect x="${x * c}" y="${y * c}" width="${7 * c}" height="${7 * c}" fill="#1B2620"/><rect x="${(x + 1) * c}" y="${(y + 1) * c}" width="${5 * c}" height="${5 * c}" fill="#fff"/><rect x="${(x + 2) * c}" y="${(y + 2) * c}" width="${3 * c}" height="${3 * c}" fill="#1B2620"/>`;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const inF = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
    const mid = x > 9 && x < 15 && y > 9 && y < 15;
    if (!inF && !mid && rnd() > 0.52) s += `<rect x="${x * c}" y="${y * c}" width="${c}" height="${c}" fill="#1B2620"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><rect width="${size}" height="${size}" fill="#fff"/>${s}${finder(0, 0)}${finder(n - 7, 0)}${finder(0, n - 7)}
    <g transform="translate(${size / 2 - c * 2.2},${size / 2 - c * 2.2}) scale(${c * 4.4 / 80})" color="#C4462A">${MARK.replace('class="mk"', 'width="80" height="79"')}</g></svg>`;
}

/* The presenter engine. Every beat has an intro that plays on arrival and a list of steps
   that the arrow key plays one at a time. Going back rebuilds the beat with no animation. */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const CANCEL = { cancel: true };
const S = { beat: 0, step: 0, run: 0, fast: false, busy: false, wake: null, notes: false };

function sleep(ms) {
  if (S.fast) return Promise.resolve();
  const tok = S.run;
  return new Promise((res, rej) => {
    const t = setTimeout(done, ms);
    S.wake = done;
    function done() { clearTimeout(t); S.wake = null; tok === S.run ? res() : rej(CANCEL); }
  });
}
async function typeIn(el, text, cps = 38) {
  if (S.fast) { el.textContent = text; return; }
  el.textContent = '';
  el.classList.add('caret');
  for (let i = 0; i < text.length; i++) {
    el.textContent = text.slice(0, i + 1);
    await sleep(1000 / cps);
  }
  el.classList.remove('caret');
}
function show(el, cls = 'pop') {
  if (typeof el === 'string') el = $(el);
  if (!el) return;
  el.classList.remove('hid');
  if (!S.fast) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  return el;
}
function flash(el) { if (typeof el === 'string') el = $(el); if (!el || S.fast) return; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
async function countTo(el, from, to, fmt, ms = 900) {
  if (S.fast) { el.textContent = fmt(to); return; }
  const n = 24;
  for (let i = 1; i <= n; i++) { el.textContent = fmt(from + (to - from) * (i / n)); await sleep(ms / n); }
}
function frag(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
const money = n => '$' + Math.round(n).toLocaleString('en-US');

/* ---------- navigation ---------- */
async function enter(b, steps, animate) {
  S.run++; S.busy = true; S.beat = b; S.step = 0;
  if (S.wake) S.wake();
  const beat = BEATS[b];
  const cv = $('#canvas');
  cv.innerHTML = `<div class="cap fade"><div class="k">${MARK}<span>${beat.k}</span></div><div class="t">${beat.t}</div><div class="s">${beat.s}</div></div><div class="area">${beat.html()}</div>`;
  S.fast = !animate || steps > 0;
  paintHud();
  cv.classList.toggle('nofx', !animate);
  const root = $('.area', cv);
  try {
    if (beat.intro) await beat.intro(root);
    for (let i = 0; i < steps; i++) { await beat.steps[i](root); S.step = i + 1; }
  } catch (e) { if (e !== CANCEL) console.error(e); else return; }
  S.fast = false; S.busy = false;
  requestAnimationFrame(() => cv.classList.remove('nofx'));

}
async function next() {
  if (S.busy) { S.fast = true; if (S.wake) S.wake(); return; }   // finish the running animation now
  const beat = BEATS[S.beat];
  if (S.clip) {
    const c = CLIPS[S.clip.i], part = c.parts[S.clip.p];
    if (S.step >= part[2]) {
      if (S.clip.p < c.parts.length - 1) { S.clip.p++; const nx = c.parts[S.clip.p]; return enter(nx[0], nx[1], true); }
      return clipEnd();
    }
  }
  if (S.step < (beat.steps || []).length) {
    S.busy = true; const tok = S.run;
    try { await beat.steps[S.step](root()); } catch (e) { if (e !== CANCEL) console.error(e); return; }
    if (tok !== S.run) return;
    S.step++; S.fast = false; S.busy = false; paintHud(); return;
  }
  if (S.beat < BEATS.length - 1) enter(S.beat + 1, 0, true);
}
function back() {
  if (S.step > 0) return enter(S.beat, S.step - 1, false);
  if (S.beat > 0) enter(S.beat - 1, (BEATS[S.beat - 1].steps || []).length, false);

function root() { return $('.area'); }

/* ---------- scale the 1440 x 900 stage to the window ---------- */
function fit() {
  const cv = $('#canvas');

  cv.style.transform = `scale(${s})`;
  cv.style.left = (innerWidth - 1440 * s) / 2 + 'px';
  cv.style.top = (innerHeight - 900 * s) / 2 + 'px';
}

    <button data-a="menu" title="All beats (G)">Beats</button>
    <button data-a="clips" title="Wow clips (C)">Clips</button>
    <button data-a="clean" title="Hide the titles, so the devices fill the screen (T)">Titles</button>

  let el = $('#notes');
  if (!S.notes) { el && el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'notes'; document.body.appendChild(el); }
  const b = BEATS[S.beat];
  const nxt = (b.steps || []).length > S.step ? (b.cue || [])[S.step] : null;
  el.innerHTML = `<h4>Wow moment</h4><div class="wow">${b.wow}</div><div class="say">${b.say}</div>
    ${nxt ? `<div class="step"><b>Next press:</b> ${nxt}</div>` : `<div class="step"><b>Next press:</b> moves to the next beat.</div>`}
    ${b.ask ? `<div class="step" style="margin-top:6px"><b>If they ask:</b> ${b.ask}</div>` : ''}`;
}
function menu(open) {
  let el = $('#menu');
  if (!open) { el && el.remove(); return; }
  el = document.createElement('div'); el.id = 'menu';
  el.innerHTML = `<div class="box"><h3>Jump to a beat</h3>${BEATS.map((b, i) => `<button data-b="${i}"><b>${i}</b>${b.t}</button>`).join('')}
  <div class="keys">Right arrow or space: next step. Left arrow: back one step. N: presenter note. G: this list. C: the wow clips. T: hide the titles so the devices fill the screen. H: hide the controls. F: full screen. R: start over.</div></div>`;
  document.body.appendChild(el);
}
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if ($('#menu') && k === 'Escape') return menu(false);
  if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); back(); }
  else if (k === 'n' || k === 'N') { S.notes = !S.notes; paintNotes(); }
  else if (k === 'g' || k === 'G') menu(!$('#menu'));
  else if (k === 'h' || k === 'H') $('#hud').classList.toggle('off');
  else if (k === 't' || k === 'T') $('#canvas').classList.toggle('clean');
  else if (k === 'r' || k === 'R') enter(0, 0, true);
  else if (k === 'f' || k === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
  else if (k === 'c' || k === 'C') clipsMenu(!$('#menu'));
  else if (k === 'Escape' && S.clip) { S.clip = null; paintHud(); }
  else if (/^[0-9]$/.test(k)) { S.clip = null; enter(+k, 0, true); }
});
document.addEventListener('click', e => {
  const a = e.target.closest('[data-a]'); const b = e.target.closest('[data-b]');
  if (a) { const x = a.dataset.a; if (x === 'next') next(); if (x === 'back') back(); if (x === 'notes') { S.notes = !S.notes; paintNotes(); } if (x === 'menu') menu(true); if (x === 'clips') clipsMenu(true); if (x === 'clean') $('#canvas').classList.toggle('clean'); if (x === 'leave') { S.clip = null; paintHud(); } return; }
  const c = e.target.closest('[data-c]');
  if (c) { menu(false); playClip(+c.dataset.c); return; }
  if (b) { menu(false); S.clip = null; enter(+b.dataset.b, 0, true); return; }
  if ($('#menu') && e.target.id === 'menu') menu(false);
});
addEventListener('resize', fit);
addEventListener('load', () => {
  fit();
  const q = new URLSearchParams(location.search);
  const startBeat = Math.min(+(q.get('beat') || 0), BEATS.length - 1);
  const startStep = +(q.get('step') || 0);
  if (q.has('notes')) S.notes = true;
  if (q.has('clips')) clipsMenu(true);
  if (q.has('clean')) $('#canvas').classList.add('clean');
  if (/^[bcd]$/i.test(q.get('bar') || '')) document.documentElement.classList.add('bar' + q.get('bar').toUpperCase());
  enter(startBeat, startStep, !q.has('still'));
});

/* ---------- wow clips ---------- */
function clipsMenu(open) {
  menu(false);
  if (!open) return;
  const el = document.createElement('div'); el.id = 'menu';
  el.innerHTML = `<div class="box" style="width:640px"><h3>Wow clips</h3><div class="sub" style="font-size:13px;margin:-4px 0 8px">Each one plays a short slice of the walkthrough, then comes back here.</div>
    ${CLIPS.map((c, i) => `<button data-c="${i}"><b>${i + 1}</b><span><span style="font-weight:700">${c.t}</span><br><span class="sub" style="font-size:13px">${c.s}</span></span></button>`).join('')}
    <div class="keys">Press C to open this list. Esc leaves a clip and carries on in the full demo.</div></div>`;
  document.body.appendChild(el);
}
function playClip(i) { S.clip = { i, p: 0 }; const p = CLIPS[i].parts[0]; enter(p[0], p[1], true); }
function clipEnd() {
  const i = S.clip.i; menu(false);
  const el = document.createElement('div'); el.id = 'menu';
  el.innerHTML = `<div class="box" style="text-align:center"><div style="font-size:40px;color:var(--orange)">${MARK}</div><h3 style="margin-top:8px">End of “${CLIPS[i].t}”</h3>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:12px">${i < CLIPS.length - 1 ? `<span class="btn fill" data-c="${i + 1}">Next clip: ${CLIPS[i + 1].t}</span>` : ''}<span class="btn" data-a="clips">All clips</span></div></div>`;
  document.body.appendChild(el);
}

</script></body></html>
